# Desktop update feed is mutable and must never be cached.
location ~ ^/desktop-updates/(production|local)-(arm64|x64)\.json$ {
    alias /opt/agentloop/desktop-updates/$1-$2.json;
    default_type application/json;
    disable_symlinks on;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}

# Content-addressed objects are immutable; Nginx supplies Range support.
location ~ ^/desktop-updates/objects/([a-f0-9]{64})$ {
    alias /opt/agentloop/desktop-updates/objects/$1;
    default_type application/octet-stream;
    disable_symlinks on;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}

location ~ ^/downloads/desktop/([a-zA-Z0-9_-]+)/([a-zA-Z0-9_.-]+\.pkg)$ {
    alias /opt/agentloop/desktop-updates/installers/$1/$2;
    default_type application/octet-stream;
    disable_symlinks on;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}
