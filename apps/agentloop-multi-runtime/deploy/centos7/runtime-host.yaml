  runtime-general-__SUFFIX__:
    image: *app_image
    command: npm run start:runtime-host
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:?set in deployment .env}
    environment:
      <<: *runtime_environment
      AGENTLOOP_RUNTIME_STATE_BACKEND: redis
      AGENTLOOP_RUNTIME_REDIS_URL: ${AGENTLOOP_RUNTIME_REDIS_URL:?set shared Runtime Redis URL}
      AGENTLOOP_RUNTIME_REDIS_NAMESPACE: ${AGENTLOOP_RUNTIME_REDIS_NAMESPACE:-agentloop-runtime-state}
      RUNTIME_ARCHIVE_ROOT: /app/apps/agentloop-multi-runtime/workspace/runtime-archives
      RUNTIME_ID: general-__SUFFIX__
      PORT: __PORT__
      MAX_CONCURRENT_RUNS: __MAX_CONCURRENT_RUNS__
    depends_on:
      router:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - runtime-general-__SUFFIX__-data:/app/apps/agentloop-multi-runtime/data
      - runtime-state:/app/apps/agentloop-multi-runtime/data/state
      - ${RUNTIME_WORKSPACE_HOST_PATH:?set in deployment .env}:/app/apps/agentloop-multi-runtime/workspace
      - ${CUSTOM_SKILLS_HOST_PATH:?set in deployment .env}:/app/apps/agentloop-multi-runtime/custom-skills:ro
      - ${LLM_PROVIDER_CONFIG_FILE:?set in deployment .env}:/run/config/llm-providers.json:ro
      - ${MCP_SERVERS_CONFIG_FILE:-${DEPLOY_ROOT:-/opt/agentloop}/config/mcp-servers.json}:/run/config/mcp-servers.json:ro
