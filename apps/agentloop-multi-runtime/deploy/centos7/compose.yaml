# Single-host Docker Compose deployment for a CentOS 7 Docker host.
#
# This file deliberately contains no `build:` section: the server either loads
# a prebuilt image tarball or builds the image from a checked-out repository.
# Configuration, secrets, workspace data and custom Skills stay outside Git
# and outside the image.  It is a single-host topology; use PostgreSQL/TiDB
# and RWX storage before scaling roles across hosts.
name: agentloop

x-runtime-environment: &runtime_environment
  HOST: 0.0.0.0
  ROUTER_URL: http://router:8788
  RUNTIME_DISPATCH_TOKEN: ${RUNTIME_DISPATCH_TOKEN:?set in deployment .env}
  RUNTIME_ATTACHMENT_TOKEN: ${RUNTIME_ATTACHMENT_TOKEN:?set in deployment .env}
  LLM_PROVIDER_CONFIG_PATH: /run/config/llm-providers.json
  STEP_EXECUTION_STRATEGY_CONFIG_PATH: ./config/step-execution-strategy.json
  WORKSPACE_ROOT: /app/apps/agentloop-multi-runtime/workspace
  MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-20}
  PLANNING_MAX_TURNS: ${PLANNING_MAX_TURNS:-4}
  STEP_MAX_TURNS: ${STEP_MAX_TURNS:-32}
  HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-1000}
  AGENTLOOP_LOG_COLOR: ${AGENTLOOP_LOG_COLOR:-never}

x-app-image: &app_image ${MULTI_RUNTIME_IMAGE:?set in deployment .env}

services:
  router:
    image: *app_image
    command: npm run start:router
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8788
      RUNTIME_CONFIG_PATH: ./config/runtimes.compose.json
      ATTACHMENT_BASE_URL: http://router:8788
      # The Web service proxies browser traffic to Router, but this stays
      # explicit for any direct Router API client.
      WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:?set the externally visible Web URL}
      RUNTIME_DISPATCH_TOKEN: ${RUNTIME_DISPATCH_TOKEN:?set in deployment .env}
      RUNTIME_ATTACHMENT_TOKEN: ${RUNTIME_ATTACHMENT_TOKEN:?set in deployment .env}
      AGENTLOOP_ROUTER_STATE_DRIVER: ${AGENTLOOP_ROUTER_STATE_DRIVER:-${AGENTLOOP_STATE_DRIVER:-sqlite}}
      AGENTLOOP_ROUTER_STATE_SQLITE_PATH: ${AGENTLOOP_ROUTER_STATE_SQLITE_PATH:-${AGENTLOOP_STATE_SQLITE_PATH:-./data/state/agentloop.db}}
      AGENTLOOP_ROUTER_STATE_DATABASE_URL: ${AGENTLOOP_ROUTER_STATE_DATABASE_URL:-${AGENTLOOP_STATE_DATABASE_URL:-}}
      AGENTLOOP_ROUTER_STATE_POOL_SIZE: ${AGENTLOOP_ROUTER_STATE_POOL_SIZE:-${AGENTLOOP_STATE_POOL_SIZE:-}}
    # Paired Local Runtime Agents connect directly to Router, so this must be
    # reachable at PUBLIC_ROUTER_URL. In production bind it to loopback only
    # when an HTTPS reverse proxy forwards the same routes.
    ports:
      - "${ROUTER_BIND_ADDRESS:-127.0.0.1}:${ROUTER_PORT:-8788}:8788"
    # Makes the CentOS Docker host addressable from application containers.
    # Required only when AGENTLOOP_*_DATABASE_URL uses host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - router-data:/app/apps/agentloop-multi-runtime/data
      - runtime-state:/app/apps/agentloop-multi-runtime/data/state
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  runtime-general-01:
    image: *app_image
    command: npm run start:runtime-host
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:?set in deployment .env}
    environment:
      <<: *runtime_environment
      RUNTIME_ID: general-01
      PORT: 8791
      AGENTLOOP_RUNTIME_STATE_DRIVER: ${AGENTLOOP_RUNTIME_STATE_DRIVER:-${AGENTLOOP_STATE_DRIVER:-sqlite}}
      AGENTLOOP_RUNTIME_STATE_SQLITE_PATH: ${AGENTLOOP_RUNTIME_STATE_SQLITE_PATH:-${AGENTLOOP_STATE_SQLITE_PATH:-./data/state/agentloop.db}}
      AGENTLOOP_RUNTIME_STATE_DATABASE_URL: ${AGENTLOOP_RUNTIME_STATE_DATABASE_URL:-${AGENTLOOP_STATE_DATABASE_URL:-}}
      AGENTLOOP_RUNTIME_STATE_POOL_SIZE: ${AGENTLOOP_RUNTIME_STATE_POOL_SIZE:-${AGENTLOOP_STATE_POOL_SIZE:-}}
    depends_on:
      router:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - runtime-general-01-data:/app/apps/agentloop-multi-runtime/data
      - runtime-state:/app/apps/agentloop-multi-runtime/data/state
      - ${RUNTIME_WORKSPACE_HOST_PATH:?set in deployment .env}:/app/apps/agentloop-multi-runtime/workspace
      - ${CUSTOM_SKILLS_HOST_PATH:?set in deployment .env}:/app/apps/agentloop-multi-runtime/custom-skills:ro
      - ${LLM_PROVIDER_CONFIG_FILE:?set in deployment .env}:/run/config/llm-providers.json:ro

  runtime-general-02:
    image: *app_image
    command: npm run start:runtime-host
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:?set in deployment .env}
    environment:
      <<: *runtime_environment
      RUNTIME_ID: general-02
      PORT: 8792
      AGENTLOOP_RUNTIME_STATE_DRIVER: ${AGENTLOOP_RUNTIME_STATE_DRIVER:-${AGENTLOOP_STATE_DRIVER:-sqlite}}
      AGENTLOOP_RUNTIME_STATE_SQLITE_PATH: ${AGENTLOOP_RUNTIME_STATE_SQLITE_PATH:-${AGENTLOOP_STATE_SQLITE_PATH:-./data/state/agentloop.db}}
      AGENTLOOP_RUNTIME_STATE_DATABASE_URL: ${AGENTLOOP_RUNTIME_STATE_DATABASE_URL:-${AGENTLOOP_STATE_DATABASE_URL:-}}
      AGENTLOOP_RUNTIME_STATE_POOL_SIZE: ${AGENTLOOP_RUNTIME_STATE_POOL_SIZE:-${AGENTLOOP_STATE_POOL_SIZE:-}}
    depends_on:
      router:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - runtime-general-02-data:/app/apps/agentloop-multi-runtime/data
      - runtime-state:/app/apps/agentloop-multi-runtime/data/state
      - ${RUNTIME_WORKSPACE_HOST_PATH:?set in deployment .env}:/app/apps/agentloop-multi-runtime/workspace
      - ${CUSTOM_SKILLS_HOST_PATH:?set in deployment .env}:/app/apps/agentloop-multi-runtime/custom-skills:ro
      - ${LLM_PROVIDER_CONFIG_FILE:?set in deployment .env}:/run/config/llm-providers.json:ro

  web:
    image: *app_image
    command: npm run start:web
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      WEB_PORT: 5174
      # This is used by Web's server-side /api proxy, not copied to the browser.
      ROUTER_URL: http://router:8788
      # This is copied into runtime-config.js for Local Runtime Agent pairing.
      ROUTER_PUBLIC_URL: ${PUBLIC_ROUTER_URL:?set the externally routable Router URL}
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-80}:5174"
    depends_on:
      router:
        condition: service_healthy

volumes:
  router-data: {}
  runtime-state: {}
  runtime-general-01-data: {}
  runtime-general-02-data: {}
