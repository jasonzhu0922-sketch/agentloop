map $http_upgrade $agentloop_connection_upgrade {
    default upgrade;
    '' close;
}

upstream agentloop_web {
    zone agentloop_web 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server agentloop-mr-web:5174 resolve;
}

upstream agentloop_router {
    zone agentloop_router 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server agentloop-mr-router:8788 resolve;
}

server {
    listen 80;
    server_name _;

    location = /agentloop {
        return 308 /agentloop/;
    }

    # Local Runtime Agents connect directly to these Router endpoints, including
    # the WebSocket control channel. The Web service's /api proxy handles HTTP only.
    location = /healthz {
        proxy_pass http://agentloop_router/healthz;
    }

    location /v1/ {
        proxy_pass http://agentloop_router;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $agentloop_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Existing Web containers may still emit development loopback settings.
    # Keep browser discovery aligned with the installed Agent until Web is
    # recreated with LOCAL_AGENT_URL and ROUTER_PUBLIC_URL configured.
    location = /agentloop/runtime-config.js {
        proxy_pass http://agentloop_web/runtime-config.js;
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/javascript text/javascript;
        sub_filter_once off;
        sub_filter 'globalThis.AGENTLOOP_LOCAL_AGENT_URL = "http://127.0.0.1:8790";' 'globalThis.AGENTLOOP_LOCAL_AGENT_URL = "http://127.0.0.1:18790";';
        sub_filter 'globalThis.AGENTLOOP_ROUTER_PUBLIC_URL = "http://router:8788";' 'globalThis.AGENTLOOP_ROUTER_PUBLIC_URL = "$scheme://$host";';
    }

    location /agentloop/ {
        proxy_pass http://agentloop_web/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $agentloop_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 80m;
    }

    location / {
        return 404;
    }
}
