map $http_upgrade $agentloop_connection_upgrade {
    default upgrade;
    '' close;
}

upstream agentloop_web {
    zone agentloop_web 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server agentloop-mr-web:5174 resolve;
}

server {
    listen 80;
    server_name _;

    location = /agentloop {
        return 308 /agentloop/;
    }

    location /agentloop/ {
        proxy_pass http://agentloop_web/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $agentloop_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 80m;
    }

    location / {
        return 404;
    }
}
