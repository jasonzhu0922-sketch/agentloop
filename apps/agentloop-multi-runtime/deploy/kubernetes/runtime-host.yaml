apiVersion: v1
kind: Service
metadata:
  name: agentloop-runtime-host
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: agentloop-runtime-host
  ports:
    - name: http
      port: 8791
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agentloop-runtime-host
spec:
  serviceName: agentloop-runtime-host
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agentloop-runtime-host
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentloop-runtime-host
    spec:
      containers:
        - name: runtime-host
          image: registry.example.invalid/agentloop/runtime-host:replace-at-release
          ports:
            - name: http
              containerPort: 8791
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8791"
            - name: RUNTIME_ID
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: ROUTER_URL
              value: http://agentloop-router
            - name: WORKSPACE_ROOT
              value: /var/lib/agentloop/workspace
            - name: SKILL_PACKAGE_STORE_ROOT
              value: /var/lib/agentloop/skill-cache
            - name: SKILL_DIRECTORIES_CONFIG_PATH
              value: /etc/agentloop/skill-directories.json
            - name: STEP_EXECUTION_STRATEGY_CONFIG_PATH
              value: /etc/agentloop/step-execution-strategy.json
            - name: LLM_PROVIDER_CONFIG_PATH
              value: /etc/agentloop-provider/llm-providers.json
            - name: AGENTLOOP_STATE_DRIVER
              value: postgres
            - name: AGENTLOOP_STATE_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: agentloop-state, key: database-url }
            - name: RUNTIME_DISPATCH_TOKEN
              valueFrom:
                secretKeyRef: { name: agentloop-runtime-auth, key: dispatch-token }
            - name: RUNTIME_ATTACHMENT_TOKEN
              valueFrom:
                secretKeyRef: { name: agentloop-runtime-auth, key: attachment-token }
          envFrom:
            - secretRef: { name: agentloop-provider-env }
          volumeMounts:
            - name: runtime-config
              mountPath: /etc/agentloop
              readOnly: true
            - name: provider-config
              mountPath: /etc/agentloop-provider
              readOnly: true
            - name: workspace
              mountPath: /var/lib/agentloop/workspace
            - name: skills
              mountPath: /mnt/agentloop-skills
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
      volumes:
        - name: runtime-config
          configMap: { name: agentloop-runtime-config }
        - name: provider-config
          configMap: { name: agentloop-provider-config }
        - name: workspace
          persistentVolumeClaim: { claimName: agentloop-workspace-rwx }
        - name: skills
          persistentVolumeClaim: { claimName: agentloop-skills-rwx }
