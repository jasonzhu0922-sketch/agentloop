# Do not apply this example. Create these Secrets through the platform secret
# manager; values must never enter Git or a ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: agentloop-state
type: Opaque
stringData:
  database-url: postgresql://replace-at-deploy
---
apiVersion: v1
kind: Secret
metadata:
  name: agentloop-runtime-auth
type: Opaque
stringData:
  dispatch-token: replace-at-deploy
  attachment-token: replace-at-deploy
---
apiVersion: v1
kind: Secret
metadata:
  name: agentloop-provider-env
type: Opaque
stringData:
  OPENAI_API_KEY: replace-at-deploy
