apiVersion: v1
kind: Service
metadata:
  name: agentloop-web
spec:
  selector:
    app.kubernetes.io/name: agentloop-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentloop-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agentloop-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentloop-web
    spec:
      containers:
        - name: web
          image: registry.example.invalid/agentloop/web:replace-at-release
          ports:
            - name: http
              containerPort: 5174
          env:
            - name: HOST
              value: 0.0.0.0
            - name: WEB_PORT
              value: "5174"
            - name: ROUTER_URL
              valueFrom:
                configMapKeyRef: { name: agentloop-public-config, key: router-url }
          readinessProbe:
            httpGet: { path: /, port: http }
          livenessProbe:
            httpGet: { path: /, port: http }
