openapi: 3.1.0
info:
  title: AgentLoop Admin API
  version: 0.0.0-wp6
  description: >-
    Independent Admin API and workload/device delivery contracts. Secret values
    and package bytes are never exposed to the Kernel or ordinary user tokens.
paths:
  /healthz:
    get:
      operationId: adminApiHealth
      responses:
        '200':
          description: Independent Admin API process is reachable.
          content:
            application/json:
              schema:
                type: object
                required: [status, service, phase]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string, const: agentloop-admin-api }
                  phase: { type: string, const: wp-1-release-core }
  /admin/v1/releases:
    get:
      operationId: listReleases
      description: Lists immutable release metadata for Admin Web read models.
      parameters:
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [integration, model_route, skill, policy] }
      responses:
        '200': { description: Release list }
        '403': { description: Missing or invalid admin principal }
    post:
      operationId: publishRelease
      description: Requires an independently authenticated admin principal and an x-request-id audit identifier.
      responses:
        '201': { description: Immutable release persisted }
        '403': { description: Missing or invalid admin principal }
        '409': { description: Optimistic revision or immutable release conflict }
  /admin/v1/target-assignments:
    post:
      operationId: createTargetAssignment
      description: Requires an independently authenticated admin principal and expectedRevision.
      responses:
        '201': { description: Assignment persisted }
        '409': { description: Scope or revision conflict }
  /admin/v1/releases/{releaseId}/transitions:
    post:
      operationId: transitionRelease
      parameters:
        - name: releaseId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: State transitioned without changing release content }
  /admin/v1/members:
    get:
      operationId: listMembers
      parameters:
        - name: tenantId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Member list without credential material }
        '403': { description: Missing or invalid admin principal }
    post:
      operationId: createMember
      responses:
        '201': { description: Member created with revision one }
        '409': { description: Revision or subject conflict }
  /admin/v1/members/{memberId}/transitions:
    post:
      operationId: transitionMember
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Member lifecycle state changed }
        '409': { description: Expected revision conflict }
  /admin/v1/audit-events:
    get:
      operationId: listAuditEvents
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200': { description: Immutable audit event list }
  /admin/v1/runs/{runId}/trace:
    get:
      operationId: readRunTrace
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Router/Runtime facts and explicit missing boundaries }
  /admin/v1/runtimes/{runtimeId}/{operation}:
    post:
      operationId: operateRuntime
      parameters:
        - name: runtimeId
          in: path
          required: true
          schema: { type: string }
        - name: operation
          in: path
          required: true
          schema: { type: string, enum: [drain, recover] }
      responses:
        '200': { description: Runtime operation state readback }
        '409': { description: Expected revision conflict }
  /delivery/v1/apply-receipts:
    post:
      operationId: recordApplyReceipt
      description: Requires workload identity; target scope is derived from that identity, not trusted from the body.
      responses:
        '201': { description: Receipt persisted }
        '403': { description: Workload identity is missing or names a different target }
  /delivery/v1/skill-artifacts/{packageHash}:
    get:
      operationId: downloadSkillArtifact
      description: Requires workload or paired device identity; package digest is part of the authorized path.
      parameters:
        - name: packageHash
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200': { description: Authorized immutable Skill package bytes }
        '403': { description: Workload or device identity is missing }
  /delivery/v1/skill-install-receipts:
    post:
      operationId: recordSkillInstallReceipt
      description: Records target-local verification/load state after a signed Skill package is installed.
      responses:
        '201': { description: Skill install receipt persisted }
        '403': { description: Workload or device identity is missing or names a different target }
  /delivery/v1/credential-grants:
    post:
      operationId: requestCredentialGrant
      description: Requires workload identity and issues one short-lived opaque capability for an active integration binding. It never returns credential material.
      responses:
        '201': { description: Opaque grant metadata issued }
        '400': { description: Invalid, unauthorized, or expired binding request }
        '403': { description: Workload identity is missing }
  /delivery/v1/integration-invocations:
    post:
      operationId: invokeIntegration
      description: Consumes one credential grant and returns a schema-validated, redacted integration result plus receipt.
      responses:
        '200': { description: Invocation result and redacted receipt }
        '400': { description: Expired grant, invalid response, or upstream failure }
        '403': { description: Workload identity is missing }
components:
  schemas:
    RuntimeConfigurationSnapshot:
      description: Versioned DTO draft; the authoritative TypeScript contract is control-plane/contracts/v1.ts.
      type: object
      required: [contractVersion, snapshotId, configurationRevision, target, resolvedAt, validUntil, integrations, skills, policies]
    ResourceRelease:
      type: object
      required: [contractVersion, resourceId, releaseId, version, kind, schemaVersion, contentHash, authorId, createdAt, state, payload]
    TargetAssignment:
      type: object
      required: [contractVersion, assignmentId, resourceId, releaseId, scope, priority, rolloutState, expectedRevision]
    ApplyReceipt:
      type: object
      required: [contractVersion, receiptId, target, releaseId, contentHash, status, observedAt]
    SkillInstallReceipt:
      type: object
      required: [contractVersion, receiptId, target, releaseId, packageHash, signer, status, observedAt]
