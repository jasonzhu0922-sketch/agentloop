<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentLoop Desktop</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #111827; color: #e5e7eb; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 20% 0, #243b53, #111827 48%); }
    main { max-width: 1120px; margin: 0 auto; padding: 36px 24px 72px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
    h1 { margin: 0 0 8px; font-size: 32px; }
    p { color: #9ca3af; }
    .status { border: 1px solid #334155; border-radius: 12px; padding: 12px 16px; min-width: 220px; background: #0f172acc; }
    .grid { display: grid; grid-template-columns: minmax(260px, 360px) 1fr; gap: 20px; }
    .panel { border: 1px solid #334155; border-radius: 16px; padding: 20px; background: #0f172ae8; box-shadow: 0 16px 48px #0004; }
    .runtime { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid #1f2937; }
    .runtime:last-child { border-bottom: 0; }
    .runtime-name { font-weight: 600; }
    .muted { color: #94a3b8; font-size: 13px; }
    button { border: 0; border-radius: 9px; padding: 9px 12px; color: white; background: #2563eb; cursor: pointer; }
    button.secondary { background: #334155; }
    input, select, textarea { width: 100%; box-sizing: border-box; border: 1px solid #475569; border-radius: 9px; padding: 10px; color: #e5e7eb; background: #111827; }
    textarea { min-height: 150px; resize: vertical; }
    label { display: block; margin: 12px 0 6px; color: #cbd5e1; font-size: 13px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    #log { white-space: pre-wrap; background: #020617; border-radius: 10px; padding: 12px; min-height: 120px; color: #cbd5e1; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } header { flex-direction: column; } }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>AgentLoop Desktop</h1>
      <p>本地页面、本地对话、本地多 Runtime；云端账号服务通过独立认证边界接入。</p>
    </div>
    <div class="status" id="status">正在连接本机服务…</div>
  </header>
  <div class="grid">
    <section class="panel">
      <h2>Local Runtime</h2>
      <div id="runtimes" class="muted">正在读取 Runtime…</div>
      <div class="row">
        <button id="refresh">刷新</button>
        <button id="create" class="secondary">新增 Runtime</button>
      </div>
    </section>
    <section class="panel">
      <h2>本地对话</h2>
      <label for="runtime">Runtime</label>
      <select id="runtime"></select>
      <label for="model">模型 Key</label>
      <input id="model" value="local:default" placeholder="例如 local:qwen">
      <label for="input">任务</label>
      <textarea id="input" placeholder="输入一个本地任务…"></textarea>
      <div class="row"><button id="run">执行</button></div>
      <div id="log" class="muted">等待执行。</div>
    </section>
  </div>
</main>
<script src="/app.js"></script>
</body>
</html>
