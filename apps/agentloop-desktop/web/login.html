<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/xuanwu-mascot-icon.png" />
    <title>登录 AgentLoop</title>
    <link rel="stylesheet" href="/login.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-intro" aria-label="AgentLoop 产品说明">
        <div class="brand"><img class="logo logo-image" src="/assets/xuanwu-mascot-icon.png" alt="玄武" /><strong>AgentLoop</strong></div>
        <div class="intro-copy">
          <p class="eyebrow">UNIFIED RUNTIME</p>
          <h1>云端统一账号<br />任务在本机执行</h1>
          <p>注册和登录由独立云端账号服务处理；对话、文件和产物保留在这台设备上。</p>
        </div>
      </section>
      <section class="auth-card-wrap">
        <form id="auth-form" class="auth-card" data-mode="login" autocomplete="on">
          <div class="auth-heading"><h2 id="auth-title">欢迎回来</h2><p id="auth-subtitle">登录后继续使用你的工作区。</p></div>
          <label>邮箱<input id="auth-email" type="email" autocomplete="email" placeholder="name@example.com" required /></label>
          <label>密码<input id="auth-password" type="password" autocomplete="current-password" placeholder="至少 12 位" minlength="12" required /></label>
          <p id="auth-service" class="auth-service" role="status">正在连接账号服务…</p>
          <p id="auth-error" class="auth-error" role="alert" hidden></p>
          <button id="auth-submit" class="auth-submit" type="submit">登录</button>
          <p class="auth-switch"><span id="auth-switch-copy">还没有账号？</span> <a id="auth-mode-toggle" href="/register">创建账号</a></p>
        </form>
      </section>
    </main>
    <script type="module" src="/login.js"></script>
  </body>
</html>
